<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkout | Farm X Kart">
    <title>Checkout | Farm X Kart</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
        <div class="head-box">

            <div class="logo-container">
                <img src="./images/Logo.jpeg" alt="Farm X Kart logo" class="logo-img" loading="lazy">
                <div class="logo-title">Farm X Kart</div>
            </div>

            <nav class="nav-container">
                <a class="nav-link" href="./index.html">Home</a>
                <a class="nav-link" href="./product.html">Products</a>
                <a class="nav-link" href="./cart.html">Cart</a>
            </nav>

            <div class="login-profile">

                <div class="login-box">
                    <a class="login" href="./login.html">Login</a>
                    <a class="signup" href="./signup.html">Sign Up</a>
                </div>

                <div class="profile-box">
                    <a href="./profile.html" class="profile">
                        <img src="./images/profilepic.jpg" alt="Profile" class="profile-img" loading="lazy">
                    </a>
                </div>

            </div>

        </div>
    </header>

<main>

    <div class="gap"></div>

    <div class="title-box">
        <div class="checkout-title">Checkout</div>
    </div>

    <div class="gap"></div>

    <div class="checkout-container">

        <div class="checkout-left">

            <div class="checkout-box">
                <h2>Delivery Address</h2>

                <form id="checkout-form">

                    <div class="input-group">
                        <label for="checkout-name">Full Name</label>
                        <input type="text" id="checkout-name" required>
                    </div>

                    <div class="input-group">
                        <label for="checkout-mobile">Mobile Number</label>
                        <input type="tel" id="checkout-mobile" maxlength="10" required>
                    </div>

                    <div class="input-group">
                        <label for="checkout-address">Address</label>
                        <textarea id="checkout-address" rows="4" required></textarea>
                    </div>

                    <div class="address-row">
                        <div class="input-group">
                            <label for="checkout-city">City</label>
                            <input type="text" id="checkout-city" required>
                        </div>

                        <div class="input-group">
                            <label for="checkout-state">State</label>
                            <input type="text" id="checkout-state" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="checkout-pincode">PIN Code</label>
                        <input type="text" id="checkout-pincode" maxlength="6" required>
                    </div>

                    <h2>Payment Method</h2>

                    <div class="payment-options">

                        <label class="payment-option">
                            <input type="radio" name="payment" value="cod" checked>
                            <span>Cash on Delivery</span>
                        </label>

                        <label class="payment-option">
                            <input type="radio" name="payment" value="upi">
                            <span>UPI</span>
                        </label>

                        <label class="payment-option">
                            <input type="radio" name="payment" value="card">
                            <span>Debit / Credit Card</span>
                        </label>

                    </div>

                    <button type="submit" class="place-order-btn">
                        Place Order
                    </button>

                </form>
            </div>

        </div>

        <div class="checkout-right">

            <div class="order-box">

                <h2>Your Order</h2>

                <div id="checkout-items"></div>

                <div class="summary-line">
                    <span>Total Items</span>
                    <span id="checkout-total-items">0</span>
                </div>

                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">₹0</span>
                </div>

                <div class="summary-line">
                    <span>Delivery</span>
                    <span id="checkout-delivery">₹0</span>
                </div>

                <div class="summary-line total-line">
                    <span>Total</span>
                    <span id="checkout-total">₹0</span>
                </div>

            </div>

        </div>

    </div>

    <div class="gap"></div>

</main>

<footer class="footer-box">
        <div class="footer-title">
            Farm X Kart
        </div>

        <div class="footer-description">
            Fresh Products, Directly from Our Farmers
        </div>

        <div class="footer-copyright">
            © 2026 Farm X Kart. All Rights Reserved.
        </div>
    </footer>

<script src="script.js"></script>

</body>
</html>
