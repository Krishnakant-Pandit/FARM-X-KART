<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkout | Farm X Kart">
    <title>Checkout | Farm X Kart</title>
    <link rel="stylesheet" href="myOrders.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="head-box">

            <div class="logo-container">
                <img src="./images/Logo.jpeg" alt="Farm X Kart logo" class="logo-img" loading="lazy">
                <div class="logo-title">Farm X Kart</div>
            </div>

            <nav class="nav-container">
                <a class="nav-link" href="./index.html">Home</a>
                <a class="nav-link" href="./product.html">Products</a>
                <a class="nav-link" href="./cart.html">Cart</a>
                <a class="nav-link" href="./wishlist.html">Wishlist</a>
            </nav>

            <div class="login-profile">

                <div class="login-box">
                    <a class="login" href="./login.html">Login</a>
                    <a class="signup" href="./signup.html">Sign Up</a>
                </div>

                <div class="profile-box">
                    <a href="./profile.html" class="profile">
                        <img src="./images/profilepic.jpg" alt="Profile" class="profile-img" loading="lazy">
                    </a>
                </div>

            </div>

        </div>
    </header>

    <main>

        <div class="gap"></div>

        <div class="title-box">
            <div class="checkout-title">My Orders</div>
        </div>
        <div class="gap"></div>

        <section class="order-box">

    <div id="empty-order" class="empty-order">
        <div class="empty-display">
            No order Placed!!
        </div>

        <a href="./product.html" class="shop-now">
            Shop Now
        </a>
    </div>

    <div id="orders-container" class="orders-container"></div>

</section>
    </main>
    <footer class="footer-box">
        <div class="footer-title">
            Farm X Kart
        </div>

        <div class="footer-description">
            Fresh Products, Directly from Our Farmers
        </div>

        <div class="footer-copyright">
            © 2026 Farm X Kart. All Rights Reserved.
        </div>
    </footer>

<script src="script.js"></script>
</body>

</html>
