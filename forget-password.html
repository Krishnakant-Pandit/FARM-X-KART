<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Farm X Kart</title>

    <link rel="stylesheet" href="forget-password.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Ole&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Playwrite+ID:wght@100..400&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <h2>Forgot Password?</h2>

            <p class="description">
                Enter your registered email address to reset your password.
            </p>

            <form id="forgot-form">

                <div class="input-group">
                    <label for="forgot-email">Email Address</label>

                    <input type="email" id="forgot-email" placeholder="Enter your email" required>
                </div>

                <button type="submit" class="continue-button">
                    Continue
                </button>

            </form>

            <p id="forgot-message"></p>

            <a href="./index.html" class="cancel">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
