<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your listed product history">
    <title>My Listed Products | Farm X Kart</title>
    <link rel="stylesheet" href="listed.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="head-box">
            <div class="logo-container">
                <img src="./images/Logo.jpeg" alt="Farm X Kart logo" class="logo-img" loading="lazy">
                <div class="logo-title">
                    Farm X Kart
                </div>
            </div>
        </div>

        <h1>Account Settings</h1>
        <div class="back-btn">
            <a href="profile.html" class="back-button">Back to Profile</a>
        </div>
    </header>

    <main>
        <section class="listed-products-box">

            <h1>Listed Product History</h1>

            <div class="summary-box">

                <div class="summary-card">
                    <div class="summary-title">Products Listed</div>
                    <div class="summary-value" id="total-products">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">Total Quantity</div>
                    <div class="summary-value" id="total-quantity">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">Total Revenue</div>
                    <div class="summary-value" id="total-revenue">₹0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-title">Latest Listing</div>
                    <div class="summary-value latest" id="latest-listing">-</div>
                </div>

            </div>

            <div id="listed-products"></div>

        </section>
    </main>

    <footer class="footer-box">
        <div class="footer-title">
            Farm X Kart
        </div>
        <div class="footer-description">
            Fresh Products, Directly from Our Farmers
        </div>
        <div class="footer-copyright">
            © 2026 Farm X Kart. All Rights Reserved.
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
