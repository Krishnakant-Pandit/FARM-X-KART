<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Ole&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Playwrite+ID:wght@100..400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="title">
                Login
            </div>
            <form class="login-form">
                <div class="login-input">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        class="input"
                        required
                        autocomplete="email">
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        class="input"
                        required
                        autocomplete="current-password">
                </div>
                <div class="signup-box">
                    <a href="#" class="signup">
                        Forget Password?
                    </a>
                    <a href="./signup.html" class="signup">
                        Do not have account? Signup
                    </a>
                </div>
                <div class="button">
                    <button type="submit" class="login-button">
                        Login
                    </button>
                    <a href="./index.html" class="cancel">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
