<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Settings - Farm X Kart</title>

    <link rel="stylesheet" href="settings.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="head-box">
            <div class="logo-container">
                <img src="./images/Logo.jpeg" alt="Farm X Kart logo" class="logo-img" loading="lazy">
                <div class="logo-title">
                    Farm X Kart
                </div>
            </div>
        </div>

        <h1>Account Settings</h1>
        <div class="back-btn">
            <a href="profile.html" class="back-button">Back to Profile</a>
        </div>
    </header>

    <main>

        <section class="settings-container">

            <div class="settings-title">
                <h2>Account Settings</h2>
                <p>Update your Farm X Kart account information</p>
            </div>

            <form id="settings-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>

                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" maxlength="10" required>
                    </div>

                </div>

                <div class="form-group full">
                    <label for="account">Account Type</label>
                    <input type="text" id="account" readonly>
                </div>

                <div class="password-section">

                    <h3>Change Password</h3>

                    <p>Leave these fields empty if you do not want to change your password.</p>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="old-password">Current Password</label>
                            <input type="password" id="old-password">
                        </div>

                        <div class="form-group">
                            <label for="new-password">New Password</label>
                            <input type="password" id="new-password">
                        </div>

                    </div>

                    <div class="form-group full">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password">
                    </div>

                </div>

                <div class="buttons">

                    <button type="button" id="cancel-button">
                        Cancel
                    </button>

                    <button type="submit" id="save-button">
                        Save Changes
                    </button>

                </div>

            </form>

            <p id="message"></p>

        </section>

    </main>

    <footer class="footer-box">
        <div class="footer-title">
            Farm X Kart
        </div>
        <div class="footer-description">
            Fresh Products, Directly from Our Farmers
        </div>
        <div class="footer-copyright">
            © 2026 Farm X Kart. All Rights Reserved.
        </div>
    </footer>

    <script src="script.js"></script>

</body>

</html>
