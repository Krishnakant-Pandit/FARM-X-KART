<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | FARM X KART</title>

    <link rel="stylesheet" href="signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Ole&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Playwrite+ID:wght@100..400&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="signup-container">
        <div class="signup-box">
            <div class="signup-title">
                Signup
            </div>
            <form class="signup-input">
                <input type="text" name="name" placeholder="Name" class="input" required>

                <div class="input-option">
                    <div class="option-title">Gender</div>
                    <div class="option">
                        <label>
                            <input type="radio" name="gender" value="male" required>
                            Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>
                        <label>
                            <input type="radio" name="gender" value="others">
                            Others
                        </label>
                    </div>
                </div>

                <input type="email" name="email" placeholder="Email" class="input" required>

                <input type="tel" name="mobile" placeholder="Mobile Number" class="input" maxlength="10"
                    pattern="[0-9]{10}" required>

                <div class="input-option">
                    <div class="option-title">Account Type</div>
                    <div class="option">
                        <label>
                            <input type="radio" name="accountType" value="customer" required>
                            Customer
                        </label>
                        <label>
                            <input type="radio" name="accountType" value="farmer">
                            Farmer
                        </label>
                    </div>
                </div>

                <input type="password" name="password" class="input" placeholder="Password" minlength="8" required>

                <input type="password" name="confirmPassword" class="input" placeholder="Confirm Password" minlength="8"
                    required>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    I agree to the Terms & Conditions
                </label>

                <a href="./login.html" class="login-link">
                    Already registered? Login
                </a>

                <div class="button">
                    <button type="submit" class="signup-btn">Signup</button>
                    <a href="./index.html" class="cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
