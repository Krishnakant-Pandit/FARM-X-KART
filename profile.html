<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="profile.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Ole&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Playwrite+ID:wght@100..400&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="profile-box">

        <div class="profile-head">

            <div class="profile-img">
                <img src="./images/profilepic.jpg" alt="profile pic" class="profile-pic">
            </div>

            <div class="profile-info">

                <div class="name" id="profile-name">
                    Loading...
                </div>

                <div class="email">
                    <span>Email</span>
                    <span id="profile-email">Loading...</span>
                </div>

                <div class="phone">
                    <span>Phone</span>
                    <span id="profile-mobile">Loading...</span>
                </div>

                <div class="Acc-type">
                    <span>Account</span>
                    <span id="profile-account">Loading...</span>
                </div>

                <div class="Buttons">

                    <button class="edit-btn" id="edit-profile">
                        Edit Profile
                    </button>

                    <button class="logout-btn" id="logout">
                        Logout
                    </button>

                </div>

            </div>
        </div>

        <div class="profile-foot">

            <a href="./myOrders.html" class="other-btn">
                My Orders
            </a>

            <a href="./cart.html" class="other-btn">
                My Cart
            </a>

            <a href="./address.html" class="other-btn">
                Change Address
            </a>

            <a href="./settings.html" class="other-btn">
                Account Settings
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
