<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Ole&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Playwrite+ID:wght@100..400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="profile-box">
        <div class="profile-head">
            <div class="profile-img">
                <img src="./images/profilepic.jpg" alt="profile pic" class="profile-pic">
            </div>
            <div class="profile-info">
                <div class="name">
                    Krishnakant Pandit
                </div>
                <div class="email">
                    <span>Email</span>
                    krishnakantpandit@gmail.com
                </div>
                <div class="phone">
                    <span>Phone</span>
                    +91 9934555915
                </div>

                <div class="Acc-type">
                    <span>Account</span>
                    Customer
                </div>
                <div class="Buttons">
                    <button class="edit-btn">
                        Edit Profile
                    </button>
                    <a href="./index.html" class="logout-btn">Logout</a>
                </div>
            </div>
        </div>
        <div class="profile-foot">
            <button class="other-btn">
                My Orders 
            </button>
            <button class="other-btn">
                My Cart
            </button>
            <button class="other-btn">
               Change Address
            </button>
            <button class="other-btn">
                Account Settings 
            </button>
        </div>
    </div>
</body>

</html>
